name: Auto-Publish Staged Scans & Ping Search Engines

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process Any Staged Scans & Regenerate RSS / Image Sitemap
        run: |
          if find Staging -mindepth 2 -maxdepth 3 -not -path "*/processed/*" \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | grep -q .; then
            sudo apt-get update && sudo apt-get install -y imagemagick webp libheif-examples
            python scripts/process-staging.py
          else
            python scripts/generate-rss.py
          fi

      - name: Commit & Push Updated Feeds if Changed
        run: |
          git config user.name "Sawyer Knox"
          git config user.email "sawyerknox@gmail.com"
          git add assets/images/ pages/ rss.xml sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto): sync processed gallery assets, rss.xml, and image sitemap [skip ci]"
            git push origin main
          fi

      - name: Ping Search Engines (IndexNow) & Syndication Check
        run: |
          python scripts/ping-search-engines.py
          python scripts/syndicate-posts.py
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
          FLICKR_API_SECRET: ${{ secrets.FLICKR_API_SECRET }}
          MEDIUM_TOKEN: ${{ secrets.MEDIUM_TOKEN }}
